name: cashly_lao
description: "Cashly - Personal finance management for Laos."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^6.7.1
  crypto: ^3.0.6
  equatable: ^2.1.0
  firebase_analytics: ^12.4.5
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  firebase_crashlytics: ^5.2.6
  firebase_messaging: ^16.4.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.1.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_svg: ^2.3.0
  fpdart: ^1.2.0
  go_router: ^17.3.0
  google_sign_in: ^7.2.0
  http: ^1.5.0
  intl: ^0.20.2
  local_auth: ^3.0.2
  material_symbols_icons: ^4.2951.0
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_cloud_firestore: ^4.2.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo/cashly_mark.png
    - assets/branding/google_logo.svg
    - assets/release/release_manifest.json
    - assets/release/distribution_policy.json
    - store_assets/screenshots/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope/Manrope-VariableFont_wght.ttf
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-VariableFont_wght.ttf
    - family: Noto Sans Lao
      fonts:
        - asset: assets/fonts/NotoSansLao/NotoSansLao-Thin.ttf
          weight: 100
        - asset: assets/fonts/NotoSansLao/NotoSansLao-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/NotoSansLao/NotoSansLao-Light.ttf
          weight: 300
        - asset: assets/fonts/NotoSansLao/NotoSansLao-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansLao/NotoSansLao-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansLao/NotoSansLao-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansLao/NotoSansLao-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansLao/NotoSansLao-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/NotoSansLao/NotoSansLao-Black.ttf
          weight: 900
