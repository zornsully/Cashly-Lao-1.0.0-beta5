name: Web review build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# This workflow produces a review artifact only. Firebase Spark deployment is
# a local, explicitly approved owner action after a public APK is verified.
permissions:
  contents: read

concurrency:
  group: cashly-web-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build review-only web artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Check source and build website
        run: |
          flutter pub get
          flutter gen-l10n
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze
          flutter test
          flutter build web --release

      - name: Reject installer binaries from the Spark bundle
        shell: bash
        run: |
          set -euo pipefail
          if find build/web -type f \( -iname '*.apk' -o -iname '*.ipa' -o -iname '*.exe' -o -iname '*.msi' -o -iname '*.dmg' \) -print -quit | grep -q .; then
            echo 'Review bundle contains a binary installer, which Firebase Spark cannot host.' >&2
            exit 1
          fi

      - name: Upload review-only web artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cashly-lao-web-review-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 7

      - name: Record deployment boundary
        shell: bash
        run: |
          echo 'Review artifact created. No Firebase Hosting site, GitHub Release, public asset, or production metadata was changed.' >> "$GITHUB_STEP_SUMMARY"
