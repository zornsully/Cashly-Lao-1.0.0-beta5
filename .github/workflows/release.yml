name: Verify manual release readiness

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable Git tag to validate, for example v1.0.2.
        required: true
        type: string

# This workflow is evidence only. It cannot sign, upload, publish, deploy, or
# alter website metadata. Android signing and both publication gates happen
# locally under the release owner's explicit approval.
permissions:
  contents: read

concurrency:
  group: cashly-manual-release-readiness-${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validate source and web candidate
    uses: ./.github/workflows/prepare-release.yml
    with:
      release_tag: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      source_ref: ${{ github.event_name == 'push' && github.ref || '' }}

  summary:
    name: Record manual release gates
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Explain the release boundary
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
          RELEASE_NOTES_SHA256: ${{ needs.verify.outputs.release_notes_sha256 }}
        run: |
          set -euo pipefail
          {
            echo "# Manual release readiness"
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Version: \`$RELEASE_VERSION\`"
            echo "- Commit: \`$RELEASE_COMMIT\`"
            echo "- Reviewed notes SHA-256: \`$RELEASE_NOTES_SHA256\`"
            echo
            echo "This workflow made no public changes. Before publication, build and validate the signed APK locally, generate checksums and reviewed notes, then obtain explicit owner approval."
            echo
            echo "After an approved public GitHub Release is anonymously checksum-verified, obtain a second explicit approval before updating Firebase Spark website metadata."
          } >> "$GITHUB_STEP_SUMMARY"
