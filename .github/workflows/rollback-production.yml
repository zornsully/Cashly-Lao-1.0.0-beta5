name: Verify manual website rollback target

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Previously verified public Android release tag to inspect.
        required: true
        type: string

# This exists only as a read-only reminder and source-tag check. It cannot
# change Firebase Hosting, GitHub Releases, website metadata, or release files.
permissions:
  contents: read

jobs:
  verify_target:
    name: Validate source rollback tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and record manual rollback steps
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Rollback accepts a stable vMAJOR.MINOR.PATCH tag only.' >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          {
            echo '# Manual rollback only'
            echo
            echo "- Requested tag: \`$RELEASE_TAG\`"
            echo "- Source commit: \`$commit\`"
            echo
            echo 'This workflow changed nothing. Use `tool/rollback_web_metadata.ps1` locally only after verifying the prior public GitHub Release asset and receiving explicit owner approval.'
            echo 'Never delete, overwrite, or retag a published APK. A GitHub release cannot be retracted by a website rollback.'
          } >> "$GITHUB_STEP_SUMMARY"
