name: Prepare manual release evidence

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      source_ref:
        required: false
        default: ''
        type: string
    outputs:
      tag:
        description: Validated immutable tag.
        value: ${{ jobs.validate.outputs.tag }}
      version:
        description: Version without v prefix.
        value: ${{ jobs.validate.outputs.version }}
      commit:
        description: Commit resolved from the tag.
        value: ${{ jobs.validate.outputs.commit }}
      release_notes_sha256:
        description: SHA-256 of checked-in review notes.
        value: ${{ jobs.validate.outputs.release_notes_sha256 }}
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable Git tag to validate.
        required: true
        type: string
      source_ref:
        description: Optional ref that must resolve to the same commit.
        required: false
        default: ''
        type: string

# GitHub Actions is intentionally read-only. It receives no signing key,
# Firebase token, deployment identity, environment approval, or write scope.
permissions:
  contents: read

concurrency:
  group: cashly-manual-release-candidate-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable tag and source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      release_notes_sha256: ${{ steps.release.outputs.release_notes_sha256 }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Validate release identity
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo 'Release tag must use vMAJOR.MINOR.PATCH or a valid prerelease suffix.' >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ -n "$SOURCE_REF" && "$(git rev-parse "$SOURCE_REF^{commit}")" != "$tag_commit" ]]; then
            echo 'The requested source ref does not resolve to the release tag commit.' >&2
            exit 1
          fi
          git checkout --detach "$tag_commit"
          flutter pub get
          dart run tool/verify_release.dart --tag "$RELEASE_TAG" --ref "$tag_commit"
          test -s RELEASE_NOTES.md
          {
            echo "tag=$RELEASE_TAG"
            echo "version=${RELEASE_TAG#v}"
            echo "commit=$tag_commit"
            echo "release_notes_sha256=$(sha256sum RELEASE_NOTES.md | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

  quality:
    name: Run quality checks and build website
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the immutable commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Check source quality
        run: |
          flutter pub get
          flutter gen-l10n
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze
          flutter test

      - name: Build review-only web candidate
        run: flutter build web --release

      - name: Confirm Spark web bundle has no binary installers
        shell: bash
        run: |
          set -euo pipefail
          if find build/web -type f \( -iname '*.apk' -o -iname '*.ipa' -o -iname '*.exe' -o -iname '*.msi' -o -iname '*.dmg' \) -print -quit | grep -q .; then
            echo 'Firebase Spark web bundle must not contain a binary installer.' >&2
            exit 1
          fi

  release_notes:
    name: Generate review-only release notes draft
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out immutable history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate a local-style review draft
        run: dart run tool/generate_release_notes.dart --to ${{ needs.validate.outputs.commit }} --output release-notes-draft.md

      - name: Upload review-only notes artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cashly-lao-release-notes-${{ needs.validate.outputs.version }}
          path: release-notes-draft.md
          if-no-files-found: error
          retention-days: 14
