name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # lib/l10n/app_localizations*.dart are gitignored generated code —
      # `generate: true` in pubspec.yaml means `flutter build`/`test` would
      # regenerate them implicitly too, but doing it explicitly here keeps
      # the analyze step (which doesn't trigger codegen on its own) from
      # failing on missing files.
      - run: flutter gen-l10n

      - run: flutter analyze

      - run: flutter test

  # Cloud Functions (functions/) — the FCM push-notification backend, this
  # repo's first non-Flutter component. Independent of the job above: no
  # Firebase Emulator Suite here (kept for a developer's own pre-deploy
  # verification), just install/lint/build/test, same as the Flutter job's
  # own scope.
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test
