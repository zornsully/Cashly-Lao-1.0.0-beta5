name: Continuous integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Every job is read-only. Releases and Firebase Spark deploys are performed
# locally only after explicit owner approval; no workflow receives credentials.
permissions:
  contents: read

concurrency:
  group: cashly-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # Pinned to actions/checkout v4.2.2.
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Keep CI on the same stable engine used for the production web
          # build. Flutter 3.44.8 includes the CanvasKit engine hotfix used
          # while remediating the blank-page incident.
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Restore Dart dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze source
        run: flutter analyze

      - name: Run automated tests
        run: flutter test

  functions:
    name: Cloud Functions quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Restore Node dependencies
        run: npm ci

      - name: Lint Functions source
        run: npm run lint

      - name: Build Functions source
        run: npm run build

      - name: Run Functions tests
        run: npm test

  firestore-rules:
    name: Firestore Rules checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # PATH is a runner default, not something the `env` context can read
      # (`${{ env.PATH }}` silently resolves to empty and, per GitHub's own
      # env-context rules, a job-level `env:` block referencing it can
      # invalidate the whole workflow file -- which is what made every job
      # in this file fail to be scheduled at all, not just this one).
      # $GITHUB_ENV / $GITHUB_PATH are the supported way to extend PATH for
      # subsequent steps.
      - name: Select Java 21 for the Firestore emulator
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - name: Restore Rules-test dependencies
        run: npm ci

      - name: Run Firestore Rules emulator tests
        run: npm test
